# Balance simulation engine.
#
# This plugin drives the *real* combat pipeline with headless fake players, so it must
# never run on a production realm. The jar being absent is the primary isolation
# mechanism; this flag is defence in depth and defaults to false.
champions:
  simulation:
    enabled: true
    # Dedicated flat-void world the duels happen in. Created on demand when the gate is
    # open, unloaded and deleted at run teardown.
    worldName: bpvp_sim
    # Monte-Carlo iterations per matchup, to average out damage min/max rolls and crits.
    # Duels cost real time, so this multiplies the sweep directly: a scope with 5,000
    # matchups at 10 iterations is 50,000 duels. Start low and raise it once the sweep
    # size is known.
    iterations: 1
    # How many duels the orchestrator runs at once. All combat state is keyed per player
    # UUID, so this is bounded by tick budget rather than correctness.
    #
    # Also the number of arenas built during warm-up, and they stay pinned for the whole run
    # whether or not a duel is using them -- so this is a fixed per-tick cost (chunk sweeps)
    # as well as a concurrency limit. Set it near what you intend to run, not far above.
    maxConcurrentDuels: 700
    # Vary concurrency during the run to hold targetMsptMillis, instead of pinning it at
    # maxConcurrentDuels. The ceiling above still bounds it, and still costs its arenas.
    #
    # Worth being clear about what this does and does not buy. Throughput RISES with
    # concurrency and saturates -- a duel takes a fixed number of ticks and the server does
    # fixed work per duel, so duels/second is C/(D*(F + P*C)), which is increasing in C. On
    # measured coefficients (~7ms/tick fixed, ~0.17ms per duel) dropping 300 -> 150 costs
    # about 11% of throughput. Governing DOWN to 20 TPS therefore gives throughput up.
    #
    # What it buys is that the rows mean something: ~130 files across champions and core time
    # their logic with System.currentTimeMillis, so a sweep at 10 TPS elapses every wall-clock
    # cooldown in half the intended ticks and measures a game nobody plays.
    #
    # To chase throughput instead, raise maxConcurrentDuels and set a looser target -- the
    # governor will climb to whatever the machine holds and the closing log line says where
    # it settled. If it reports never leaving the ceiling, the ceiling was the binding
    # constraint and there is more throughput available.
    #
    # NOT part of config_hash, and neither are maxConcurrentDuels, the target or the floor.
    # Concurrency does not change what a duel measures -- duels are tick-driven end to end and
    # do not interact -- it changes how fast the sweep gets through them. Hashing it only broke
    # resume: a sweep stopped, retuned and restarted was refused as a candidate over a knob
    # that changes nothing. All of it is recorded on sim_run.scenario instead, and what the run
    # actually sustained is logged when it closes.
    adaptiveConcurrency: true
    # Median tick PROCESSING time (ms) the governor holds under -- MSPT, read from the
    # server's own tick times, not the interval between ticks. The distinction matters: a
    # healthy server sleeps out the rest of its budget, so the interval is pinned at 50ms
    # however idle the machine is and a controller fed it can never see headroom. MSPT is the
    # work, and on a healthy sweep reads well under 50.
    #
    # 50.0 is the whole budget (20 TPS); 45 leaves the controller room to settle rather than
    # sitting on the boundary. Growth needs the median 8% under this, so at 45 the sweep grows
    # while MSPT is below ~41ms. Raise the target to trade tick headroom for throughput.
    targetMsptMillis: 50.0
    # Fewest duels the governor will cut to. A floor rather than zero, so a sweep that cannot
    # hold its budget keeps measuring slowly instead of silently ceasing to advance.
    #
    # Also where an adaptive run STARTS. Opening at the ceiling instead guarantees the first
    # minutes are over budget by construction: run 5 opened at 600 duels and a 104.8ms median
    # against a 50ms target, and needed four cuts (600 -> 510 -> 434 -> 369 -> 314) to get
    # under it, measuring every duel of that descent on an overloaded server. Climbing from
    # here reaches the same equilibrium -- the controller steers on tick time either way.
    minConcurrentDuels: 64
    # Median tick (ms) at or above which a FINISHED duel is thrown away and measured again.
    #
    # Not a throughput guard; a correctness one, and the same reason targetMsptMillis exists.
    # Roughly 130 files across champions and core time their game logic on
    # System.currentTimeMillis while a duel advances on ticks, so on a lagging server every
    # wall-clock cooldown elapses in fewer ticks than the game intends and the attacker gets
    # more of them. The row that comes out is not noisy, it is a different game.
    #
    # 60 against a 50 target: above ordinary controller wobble, below a real excursion. A
    # rejected duel is re-queued at the tail, so the sweep's shape never changes -- only its
    # wall clock. After 3 rejections a matchup is kept anyway and WARNED about, because a
    # machine that cannot recover would otherwise re-queue forever and never finish.
    #
    # 0 disables it, keeping every measurement whatever the tick rate.
    rejectAboveMsptMillis: 60.0
    # Hard stop for a single duel, so a matchup that can never kill does not stall a run.
    #
    # Also the run's main throughput term once the sweep reaches builds that cannot kill: a duel
    # ending on a kill frees its concurrency slot in a couple of seconds, one that times out holds
    # it for all of this. The progress line reports how many completed duels ran the clock out and
    # what share of the run that is, and the closing line prices it in slot-time -- read those
    # before lowering this, and before assuming a receding ETA means the server is struggling.
    duelTimeoutSeconds: 45.0
    # Which slice of the permutation space /simulate sweeps when given no argument.
    #   MELEE   - role x default weapon. The phase 1 baseline; cheapest.
    #   WEAPONS - role x every melee weapon, no skills to confound the weapon axis.
    #   RUNES   - role x default weapon x one socketed rune at a time, plus a bare baseline.
    #   SKILLS  - one skill at a time over its level range, on plain and booster weapons,
    #             at min/base/max weapon damage. The only tier --audit works on: it is the
    #             one that measures a skill-less baseline to subtract. The three damage
    #             rolls are what separate a flat skill from a percentage one -- contribution
    #             is a + b*weaponDamage, so two points fix both coefficients and the third
    #             checks the form. Boosters are NOT a usable second point: a booster raises
    #             a SWORD/AXE/BOW skill's effective level by one, so it moves damage and
    #             level together. Once b is known the skill x weapon x rune cross is
    #             arithmetic over an EQUIPMENT run rather than duels.
    #   LOADOUT - distinct weapon profiles x every rune each accepts, no skills. Neither
    #             WEAPONS nor RUNES crosses those two axes, so until this tier a rune had
    #             only ever been measured on the default weapon.
    #   EQUIPMENT-the whole item space and nothing else: distinct weapon profiles, each at
    #             min/base/max damage, carrying every rune SET it can hold (combinations up
    #             to 4 sockets -- 386 per sword, 562 per axe), against armour at base and max.
    #             This is LOADOUT without its two restrictions: LOADOUT takes one rune at a
    #             time and only ever the configured roll. Large: budget on the order of
    #             100,000 builds, so raise maxBuilds and drop iterations before running it.
    #   FULL    - all of EQUIPMENT crossed with every budget-feasible build. Genuinely
    #             exhaustive and correspondingly enormous -- the rune axis alone multiplies
    #             the space by several hundred. Only enumerable under a narrow skillFilter,
    #             and refused with its count when it is not. Check the logged count first.
    #   BASELINE- FULL's build half with every lossless reduction applied: weapons
    #             deduplicated by stat profile, targets collapsed by health, skills limited
    #             to relevantSkills below. The reductions are what make an exhaustive run
    #             finishable, which is what makes it a baseline -- a stopped FULL is a
    #             sample, not one. Runes and stat rolls are not terms here; BASELINE and
    #             EQUIPMENT together are the pair that covers what FULL does, separately
    #             enough that each one finishes.
    # A running sweep can be stopped with "/simulate stop", which drains the duels in
    # flight and writes everything measured so far under status CANCELLED.
    #
    # A sweep can also be narrowed, two independent ways. See docs/balance-simulation/
    # DELTA-SWEEPS.md.
    #
    #   --weapons=  --skills=  --runes=  --roles=  --targets=  --armor=
    #     Comma-separated, and lenient about form: champions:wind_blade, wind_blade,
    #     windblade and "Wind Blade" are one name, and a trailing * is a prefix. Narrows
    #     WHICH PERMUTATIONS EXIST, applied during enumeration rather than after -- so
    #     "/simulate EQUIPMENT --weapons=thornfang" is a full EQUIPMENT sweep of one
    #     weapon (every roll, every rune set it accepts) and costs minutes, not a day.
    #     A selector that matches nothing REFUSES the sweep and lists what was available:
    #     an empty sweep completes in seconds and reports COMPLETED, so a typo would
    #     otherwise look exactly like a healthy run. Part of config_hash, so a narrowed
    #     run is never resumed into or diffed against a full one.
    #
    #     --armor takes SET IDS rather than tier numbers -- "none", "reinforced" -- and
    #     covers every roll of the set it names. Set ids because the tier is an ordering
    #     by durability that the sweep computes from the pieces' live HEALTH stats, so
    #     registering a flimsier set renumbers every tier above it, and a selector typed
    #     against the old numbering would silently start selecting a different set.
    #
    #   --changed  /  --changed=<runId>
    #     Narrows WHICH OF THEM STILL NEED DUELS. Every build carries a config_scope_hash
    #     over just the config it depends on -- its weapon, its runes, its skills, its
    #     armour, its role's base health -- so a sweep can compare its catalog against a
    #     baseline run matchup by matchup and re-measure only what actually moved. Note
    #     this is the OPPOSITE of --resume: a resume finishes a sweep interrupted at an
    #     unchanged config, and finds no candidate the moment a balance value moves, which
    #     is exactly when --changed becomes useful.
    #
    #     A delta run is still a WHOLE run: the unchanged rows are copied in from the
    #     baseline rather than left out, so every dashboard and every gold mart keeps
    #     working with no union step. sim_result.measured_run_id says which run's duels
    #     produced each row. --no-carry opts out and gives an explicitly partial run.
    #
    # A stopped or crashed sweep can be picked up with "/simulate <SCOPE> --resume". It
    # continues the newest interrupted run at the same config_hash -- same sim_run row, same
    # sim_build rows, skipping every matchup already reduced to a sim_result row -- so a long
    # sweep can be finished across several sittings and still be ONE run to a dashboard.
    # Candidacy is config_hash alone, which covers scope, scenario, iterations, timeout,
    # concurrency, skill filter, relevantSkills, channelHoldTicks, every balance value and the
    # engine version: change any of them and there is no candidate, so a resume can never
    # splice rows measured under a different game onto an existing run. It opens a new run in
    # that case rather than failing, so the flag is safe to type when there is nothing to
    # resume. Note that maxBuilds is deliberately NOT part of the hash -- it can only refuse an
    # enumeration, never truncate one, so raising it between sittings is safe.
    scope: MELEE
    # Whether a duel drives one side or both, when /simulate is given no second argument.
    #   ONE_WAY - only the attacker acts. ttk_s is an unconditional "how long this build
    #             needs to kill that target". The phase 1 and 2 measurement.
    #   MUTUAL  - both sides swing and both rotations run; the duel ends when either dies.
    #             Makes the attacker's own reactive passives and DefensiveSkills measurable
    #             (Vengeance only ramps while its holder is being hit), at the cost that
    #             ttk_s becomes "how long when it won" and extras.kill_rate carries the rest
    #             of the answer. Never mixed within a run.
    scenario: ONE_WAY
    # Refuse a scope that enumerates more builds than this rather than truncating it -- a
    # prefix of an enumeration is a biased sample and nothing on the row would say so.
    #
    # 10,000 was sized for the tiers that predate the rune and stat-roll axes, and it refuses
    # every tier that crosses them: EQUIPMENT, LOADOUT, BASELINE and FULL all run to six figures.
    # That default is why no multi-skill sweep had ever been run -- BASELINE is not slow under it,
    # it is refused outright, and the refusal reads as a scope problem rather than a knob.
    #
    # 400,000 admits BASELINE and EQUIPMENT and still refuses FULL. The numbers behind it, so the
    # next person can re-derive rather than trust it:
    #
    #   BASELINE  287,398 builds  (BUDGET_VECTORS over the 48 relevantSkills below, six slots,
    #                              12 points, weapons deduplicated, no runes). Enumerated per
    #                              role: KNIGHT 147,793, MAGE 74,526, WARLOCK 28,865,
    #                              BRUTE 28,696, ASSASSIN 5,703, RANGER 1,815.
    #   EQUIPMENT ~290,000 builds  (run 1 enumerated 289,548).
    #   FULL      tens of millions -- BASELINE multiplied by the rune axis. Still refused, which
    #                              is correct: it exhausts the heap while being enumerated, at
    #                              any cap.
    #
    # What follows from BASELINE is roughly 3.7M duels at 13 targets and one iteration, against
    # run 1's 4.34M duels in 35 hours -- so it is a comparable sitting, not a new class of run.
    # Raise this further only from a count a refusal actually printed, never upward in guesses:
    # the duel count that follows is builds x targets x iterations and duels cost wall clock.
    maxBuilds: 400000
    # Which skills may appear in an enumerated build. Skills occupy six independent slots,
    # so this is the lever with the most leverage on sweep size: FULL over every enabled
    # skill is ~60 million builds and cannot be enumerated at all.
    #   OFFENSIVE          - skills the engine can drive that declare themselves offensive.
    #                        The default: a one-way row measures the attacker's damage, so
    #                        nothing else can move a column on it.
    #   EXERCISABLE        - every skill the engine has an input for. What a MUTUAL sweep of
    #                        defensive builds wants, since a defensive skill does move the
    #                        attacker's TTK once the defender fights back.
    #   OFFENSIVE_PASSIVES - the phase 2 default. Melee plus offensive passives, no actives.
    #   PASSIVES           - every passive, including defensive/movement ones.
    #   ALL                - no filter, including the bow archetypes this engine cannot
    #                        drive. Those measure as an empty slot, so this is for sizing
    #                        that gap rather than for balance work.
    #   RELEVANT           - only the skills listed in relevantSkills below. The strongest
    #                        prune, and the only one derived from measurement rather than
    #                        from a marker interface -- so a skill whose author forgot the
    #                        OffensiveSkill marker is still swept if a sweep saw it work.
    # Recorded in config_hash: two runs at one scope with different filters are not
    # comparable, and nothing else on the row would say so.
    skillFilter: RELEVANT
    # The reviewed output of a skill relevance audit: the skill names a RELEVANT sweep is
    # allowed to build permutations from.
    #
    # Written as a YAML list. A comma-separated string on one line is also accepted and means
    # exactly the same thing, so an older config keeps working -- but the list is the form to
    # use, because it is what the audit artifact emits and it stays readable at fifty entries.
    #
    # Populate it by hand, from an audit you have read:
    #   1. /simulate SKILLS ONE_WAY --audit
    #   2. read plugins/<this plugin>/audits/skill-audit-run-<id>.yml
    #   3. paste its relevantSkills names here, minus any you disagree with
    #
    # Nothing writes to this automatically, and that is deliberate. An INERT verdict means
    # "moved nothing measurable in this scenario", not "does nothing" -- a crowd-control or
    # repositioning skill lands there correctly and would be excluded forever by a pipeline
    # that applied its own findings. It also goes stale in the other direction: a skill
    # buffed from zero stays off this list until the audit is re-run, which is why the
    # artifact records the config_hash it was taken under.
    #
    # Empty is a hard error for the RELEVANT filter rather than a skill-less sweep, because
    # a sweep with no skills in it completes normally and looks perfectly healthy.
    # Hashed into config_hash (sorted), so two runs of different lists are never diffed as
    # though they swept the same space, while reordering it during review is not a change.
    relevantSkills:
      - Combo Attack
      - Energy Pool
      - Sever
      - Slash
      - Block Toss
      - Flesh Hook
      - Fortify
      - Overwhelm
      - Whirlwind Sword
      - Defensive Stance
      - Hilt Smash
      - Sacrifice
      - Swordsmanship
      - Vanguards Might
      - Arctic Armour
      - Blizzard
      - Immolate
      - Inferno
      - Null Blade
      - Pestilence
      - Void
      - Wind Dagger
      - Blood Sphere
      - Frailty
      - Grasp
      - Leech
      - Soul Bonds
      - Tormented Soil
      - Wolfs Fury
      - Blood Barrier
      - Lightning Orb
      - Agility
      - Rupture
      - Defensive Aura
      - Vengeance
      - Magnetic Axe
      - Hold Position
      - Fortitude
      - Deflection
      - Threatening Shout
      - Viper Strikes
      - Level Field
      - Resilience
      - Smoke Bomb
      - Concussion
      - Evade
      - Wreath
      - Takedown
    # How long the rotation holds right click for a channel or charge skill, in ticks.
    # This is the engine's one policy choice rather than an observation -- a channel deals
    # damage for as long as it is held -- so it is written into sim_run.scenario, and two
    # runs with different budgets are not comparable for channel builds.
    channelHoldTicks: 40
    # How often the rotation may re-press a button that did not fire, in ticks. A rate limit
    # on event dispatches, not a model of anything: whether a skill fires is still the real
    # cooldown and energy gates' decision.
    skillRetryIntervalTicks: 5
    # Duels started per tick. Spawning two ServerPlayers and equipping them is tens of
    # milliseconds of main-thread work, so filling the whole concurrency budget in one
    # tick stalls the server and staggers when duels actually engage.
    duelSetupsPerTick: 20
    # How often a running sweep reports duels done / matchups measured / ETA, to the
    # console and to whoever ran /simulate. Floored at 1 second.
    progressIntervalSeconds: 15.0
    # Write a sim_duel_diagnostic row for every duel.
    #
    # Off by default: this is one row per duel where sim_result is one per matchup, so a
    # sweep of 100,000 duels writes 100,000 rows carrying a JSON blob each.
    #
    # Turn it on when a result needs explaining rather than reporting. Every figure on
    # sim_result is a mean over the matchup's iterations, and run 164 produced matchups
    # where the skill-less baseline killed in 10 of 10 duels and the same build carrying
    # one inert passive -- no button, no damage -- died in 10 of 10, with per-hit damage
    # deterministic to zero variance across the whole sweep. A mean cannot express that;
    # this table can. It records what both sides started the duel from (attributes, health,
    # effects, effective skill levels, the state the pooled entity arrived carrying), how
    # worn the pooled entities were, the damage funnel per side, and every landed hit in
    # both directions with its tick.
    #
    # Deliberately not part of config_hash: observing a duel must not make it a different
    # duel, so a diagnostic run stays diffable against the run it is explaining.
    #
    # On by default as of the 2026-08-08 baseline. The sweep is bound by wall clock, not by
    # storage: run 1 spent 35 hours to produce 19 GB, and the volume Postgres sits on has
    # ~920 GB free. Capture that records what the duels are already doing therefore costs
    # almost nothing that matters, and not having it is what made runs 164 and 168 take
    # weeks to explain. Measured on 147,634 real rows: 1,620 bytes each, so a full
    # 4.34M-duel EQUIPMENT sweep is about 6.7 GB.
    duelDiagnostics: true
    # Ceiling on diagnostic rows per run. A stop rather than a sample -- the rows that exist
    # are a contiguous prefix of the sweep, which matters because the leading hypothesis is
    # about how a duel's position in the sweep affects its outcome, and a sampled table
    # cannot answer a question about ordering.
    #
    # 6,000,000 covers a full EQUIPMENT sweep (4.34M duels at one iteration) with room for
    # the iteration count to rise, and costs ~9.7 GB at the measured row size.
    duelDiagnosticsMaxRows: 10000000

    # Write a sim_trace row for every landed hit.
    #
    # These two existed only as @Config annotation defaults in SimulationGate and were not
    # documented here at all, which is why the cap sat at 2,000,000 -- about 4% of a full
    # sweep -- with nothing saying so.
    #
    # This is the table that answers "what is the full range of damage", as opposed to the
    # mean over a matchup that sim_result carries. A distribution needs the individual hits,
    # and once a duel has been fought and thrown away the only way to get them back is to
    # fight it again. It is also the only table that can locate the sweep's known
    # non-reproducibility (2.3% of MUTUAL matchups, 5.2% of ONE_WAY ones diverge between
    # repeat iterations): two iterations of one matchup can be diffed straight down their
    # tick axis until the first row that disagrees.
    #
    # Cost, measured by inserting 500,000 representative rows: 565 bytes each, most of it
    # the (run_id, build_id, target_role, target_armor, iteration, tick, seq) index rather
    # than the row. Run 1 averaged 12.17 hits per duel over 4.34M ONE_WAY duels, so a full
    # sweep is ~52.8M rows and ~28 GB.
    hitTrace: true
    # Ceiling on trace rows per run, same contiguous-prefix semantics as the diagnostics cap.
    # 80,000,000 leaves headroom for MUTUAL, which writes both sides' hits rather than one.
    # At the measured row size that is ~45 GB in the worst case.
    hitTraceMaxRows: 80000000

command:
  simulate:
    enabled: true
    requiredRank: DEVELOPER
