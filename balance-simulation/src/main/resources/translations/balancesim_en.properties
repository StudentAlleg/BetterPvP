balancesim.command.balancesim.description=balance simulation admin commands (dev servers only)
balancesim.command.reload.description=reload the balance simulation config
balancesim.command.reload.success=Reloaded BalanceSimulation.
balancesim.command.reload.sweepRunning=<red>A simulation sweep is running.</red> Reloading would change its settings mid-flight, and its config_hash would no longer describe it. Run <yellow>/simulate stop</yellow> first.
balancesim.command.simulate.description=run a balance simulation sweep (dev servers only)
balancesim.command.simulate.disabled=Simulation is disabled. Set champions.simulation.enabled to true in the BalanceSimulation config.
balancesim.command.simulate.started=Starting balance simulation sweep at scope <green><0></green>, scenario <green><1></green>. See the server log for the matchup count.
balancesim.command.simulate.progress=Sweep <green><0></green>/<green><1></green> duels (<yellow><2></yellow>%), <green><3></green> in flight, <green><4></green>/<green><5></green> matchups measured. Elapsed <yellow><6></yellow>, remaining <yellow><7></yellow>, done by <yellow><8></yellow>.
balancesim.command.simulate.finished=Sweep <green><0></green> [<green><1></green>] finished with status <green><2></green>. <green><3></green>/<green><4></green> duels measured, <green><5></green>/<green><6></green> matchups reduced, <green><7></green> result rows written in <yellow><8></yellow>.
balancesim.command.simulate.partial=<red>This run did not cover every planned matchup. Treat its sim_result rows as partial.</red>
balancesim.command.simulate.stopping=<yellow>Stopping the sweep.</yellow> No further duels will start; the ones in flight are being drained and everything measured so far will be written. Wait for the summary line.
balancesim.command.simulate.notRunning=<red>No simulation sweep is running.</red>
balancesim.command.simulate.failed=Balance simulation sweep failed. See the server log.
balancesim.command.simulate.badScope=<red><0></red> is not a simulation scope. Valid scopes: <yellow><1></yellow>.
balancesim.command.simulate.badScenario=<red><0></red> is not a simulation scenario. Valid scenarios: <yellow><1></yellow>.
